[project]
name = "morpheu"
version = "0.1.0"
description = "Local voice cloning, voice design and text-to-speech studio"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pywebview>=5.0",
    "qwen-tts",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
